apiVersion: erpbridge.io/v1
kind: MCPTool
metadata:
  name: list_employees
  version: 1.0.0
  module: hr
spec:
  description:
    short: "List all active and inactive employees with basic profile information."
    whenToUse:
      - "User asks for employee list"
      - "User requests staff directory"
    examples:
      - "Show all employees"
      - "Who works here?"
  inputSchema:
    type: object
    properties:
      department:
        type: string
        description: "Filter by department"
  execution:
    type: http
    method: GET
    endpoint: "http://localhost:8081/api/resource/Employee"
    mapping:
      department: "department"
    responsePath: "data"
  security:
    authType: "api-key"
    credentialRef: "ERP_PRIMARY_KEY"
  cache:
    enabled: true
    ttlSeconds: 3600
  routing:
    priority: 0.9
    signals: ["employee", "staff", "HR"]
