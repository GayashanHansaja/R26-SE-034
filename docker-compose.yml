version: "3.9"

services:

  mock-erp:
    build:
      context: ./mock-erp
    ports:
      - "8081:8081"
    environment:
      - LOG_LEVEL=debug
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  embedder:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    command: --model-id sentence-transformers/all-MiniLM-L6-v2 --port 8083
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  redis:
    image: redis/redis-stack:7.2.0-v9
    ports:
      - "6379:6379"
      - "8001:8001"   # RedisInsight — remove in production
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 3

  middleware:
    build:
      context: .
      dockerfile: Dockerfile.middleware
    ports:
      - "8080:8080"
    environment:
      - ERP_BASE_URL=http://mock-erp:8081
      - REDIS_URL=redis://redis:6379
      - EMBEDDER_URL=http://embedder:8083
      - SCHEMAS_DIR=/app/schemas
    volumes:
      - ./schemas:/app/schemas
    depends_on:
      mock-erp:
        condition: service_healthy
      redis:
        condition: service_healthy
      embedder:
        condition: service_healthy

volumes:
  redis-data:
