version: "3.9"

services:

  mock-erp:
    build:
      context: .
      dockerfile: Dockerfile.mock-erp
    ports:
      - "8081:8081"
    environment:
      - LOG_LEVEL=debug
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8081"]
      interval: 5s
      timeout: 5s
      retries: 5

  middleware:
    build:
      context: .
      dockerfile: Dockerfile.middleware
    ports:
      - "8080:8080"
    environment:
      - ERP_BASE_URL=http://mock-erp:8081
      - SCHEMAS_DIR=/app/schemas
    volumes:
      - ./schemas:/app/schemas
    depends_on:
      mock-erp:
        condition: service_healthy
