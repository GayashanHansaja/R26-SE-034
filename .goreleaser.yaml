# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: erpbridge

before:
  hooks:
    - go mod tidy

builds:
  - id: erpbridge-server
    main: ./services/erpbridge-server/main.go
    binary: erpbridge-server
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

  - id: bridgectl
    main: ./tools/bridgectl/main.go
    binary: bridgectl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: erpbridge-server
    ids: [erpbridge-server]
    formats: ['tar.gz']
    name_template: >-
      erpbridge-server_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - README.md
    format_overrides:
      - goos: windows
        formats: ['zip']

  - id: bridgectl
    ids: [bridgectl]
    formats: ['tar.gz']
    name_template: >-
      bridgectl_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - README.md
    format_overrides:
      - goos: windows
        formats: ['zip']

  - id: combined
    ids: [erpbridge-server, bridgectl]
    formats: ['tar.gz']
    name_template: >-
      erpbridge-full_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - README.md
    format_overrides:
      - goos: windows
        formats: ['zip']

dockers_v2:
  - ids:
      - erpbridge-server
    images:
      - "ghcr.io/{{ .Env.REPO_OWNER }}/erpbridge-server"
    tags:
      - "{{ .Version }}"
      - "latest"
    labels:
      "org.opencontainers.image.created": "{{.Date}}"
      "org.opencontainers.image.title": "erpbridge-server"
      "org.opencontainers.image.revision": "{{.FullCommit}}"
      "org.opencontainers.image.version": "{{.Version}}"
    dockerfile: Dockerfile.server.releaser

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: nmdra
    name: ERPBridge
  footer: |
    ---
    Released by [GoReleaser](https://goreleaser.com).

snapshot:
  version_template: "{{ .Tag }}-next"
